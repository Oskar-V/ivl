name: benchmark
run-name: ${{ github.actor }} requested benchmarks
# Runs the mitata benchmarks and writes the results into the "Benchmarks" section at
# the end of README.md:
#   - pull requests from this repo: the updated README is committed to the PR branch,
#     so the performance change shows up in the PR diff
#   - pull requests from forks: the token is read-only, so results only go to the job summary
#   - pushes to main: the README is committed to main, unless the push is a merged PR
#     from this repo (that PR already committed fresh results)
# Commits made with GITHUB_TOKEN do not trigger workflows, so this cannot loop.
on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
  workflow_dispatch:

# One run per branch; a newer push makes the in-flight results obsolete.
concurrency:
  group: benchmark-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the updated README
      pull-requests: read # look up which PR a push to main came from
    steps:
      - name: Decide whether to commit results
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SHA: ${{ github.sha }}
        run: |
          commit=true
          if [ "$EVENT" = "pull_request" ] && [ "$HEAD_REPO" != "$REPO" ]; then
            echo "Fork PR: results go to the job summary only"
            commit=false
          elif [ "$EVENT" = "push" ]; then
            merged=$(gh api "repos/$REPO/commits/$SHA/pulls" \
              --jq "[.[] | select(.merged_at != null and .head.repo.full_name == \"$REPO\")] | length")
            if [ "$merged" != "0" ]; then
              echo "Push is a merged PR from $REPO; its branch already has fresh results"
              commit=false
            fi
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Same-repo PRs check out the branch itself (not the merge commit) so we can push to it
          ref: ${{ github.event_name == 'pull_request' && steps.plan.outputs.commit == 'true' && github.head_ref || '' }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # Node runs the same benchmark on V8, which most users run in production
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `shell: bash` adds pipefail, so a crashing benchmark fails the step instead of being hidden by tee.
      # The runtimes run one after the other so they don't compete for CPU.
      - name: Run benchmarks on Bun (JavaScriptCore)
        shell: bash
        run: BENCH_FORMAT=markdown bun run benchmark | tee "$RUNNER_TEMP/bench-bun.md"

      - name: Run benchmarks on Node (V8)
        shell: bash
        run: BENCH_FORMAT=markdown bun run benchmark:node | tee "$RUNNER_TEMP/bench-node.md"

      - name: Add results to job summary
        run: |
          {
            echo "## Bun (JavaScriptCore)"; cat "$RUNNER_TEMP/bench-bun.md"
            echo; echo "## Node (V8)"; cat "$RUNNER_TEMP/bench-node.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update README benchmark section
        if: steps.plan.outputs.commit == 'true'
        run: bun run ./scripts/update-readme-benchmark.ts "$RUNNER_TEMP/bench-bun.md" "$RUNNER_TEMP/bench-node.md"

      - name: Commit and push README
        if: steps.plan.outputs.commit == 'true'
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git diff --quiet -- README.md; then
            echo "README unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update benchmark results"
          # Someone may have pushed while the benchmarks ran
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
