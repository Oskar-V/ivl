name: run-tests
run-name: ${{ github.actor }} requested tests
# Runs once per commit: on every push to any branch in this repo, and on PRs from forks
# (whose pushes happen in the fork, not here). PRs from branches in this repo are already
# covered by the push run, so their pull_request run is skipped. Tag pushes are left
# to publish.yaml. No path filter: package.json, the lockfile, tsconfig, jsr.json, and
# the workflows themselves all affect the result.
on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "**"

jobs:
  run-tests:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Typecheck (including type-level tests)
        run: bun run typecheck

      - name: Build
        run: bun run build

      # Catches JSR-only problems (unresolvable specifiers, missing exports) before a release
      - name: JSR publish dry run
        run: bunx jsr publish --dry-run
